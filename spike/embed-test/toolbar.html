<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<title>NEXUS Phase 0</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
         background: #15161a; color: #e6e6e6; font: 13px system-ui, sans-serif; box-sizing: border-box; }
  button { background: #262830; color: inherit; border: 1px solid #353844; border-radius: 6px;
           padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #30333d; }
  button.active { background: #4f46e5; border-color: #6366f1; }
  .sep { width: 1px; height: 24px; background: #353844; }
  #status { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #a0a3ad; }
  #status.err { color: #f87171; }
  #meta { color: #6b6f7b; font-size: 11px; }
</style>
</head>
<body>
  <span id="tabs"></span>
  <span class="sep"></span>
  <button id="reload" title="Neu laden">↻</button>
  <button id="home" title="Startseite des Anbieters">⌂</button>
  <button id="external" title="Im Standardbrowser öffnen">Extern</button>
  <span class="sep"></span>
  <span id="status">…</span>
  <button id="clear" title="Sitzung dieses Anbieters löschen">Abmelden/Löschen</button>
  <button id="relaunch" title="App neu starten (Sitzungstest)">Neustart</button>
  <span id="meta"></span>
  <script src="toolbar.js"></script>
</body>
</html>
